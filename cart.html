<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart | NCE Canteen</title><link rel="stylesheet" href="style.css"></head>
<body><header class="topbar"><a class="brand" href="index.html">🍽️ <span id="collegeName">Nehru College of Engineering</span></a><nav><a href="menu.html">Menu</a><a href="orders.html">My Orders</a><a href="cart.html" class="active cart-link">Cart <span id="cartCount">0</span></a></nav></header>
<main class="page"><div class="page-title"><span class="eyebrow">YOUR SELECTION</span><h1>Cart & checkout</h1></div>
<div class="cart-layout"><section><div id="cartItems"></div><div id="empty" class="empty hidden"><div>🛒</div><h2>Your cart is empty</h2><p>Add something tasty from the menu.</p><a class="btn primary" href="menu.html">Browse Menu</a></div></section>
<aside class="summary"><h2>Order summary</h2><div id="summaryRows"></div><div class="total"><span>Total</span><strong id="total">₹0</strong></div><label>Pickup time<select id="pickup"><option>10:30 AM</option><option>11:00 AM</option><option>11:30 AM</option><option>12:00 PM</option><option>12:30 PM</option><option>1:00 PM</option><option>1:30 PM</option><option>2:00 PM</option><option>3:00 PM</option></select></label><label>Note (optional)<textarea id="note" rows="3" placeholder="Less spicy, no sugar, etc."></textarea></label><button id="placeOrder" class="btn primary full">Place Pre-Order</button><p id="checkoutMsg" class="form-message"></p></aside></div></main>
<script type="module" src="cart.js"></script></body></html>
