<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Registration</title><link rel="stylesheet" href="style.css"></head>
<body class="auth-page"><header class="topbar"><a class="brand" href="index.html">🍽️ <span id="collegeName">Nehru College of Engineering</span></a><nav><a href="index.html">Home</a><a href="menu.html">Menu</a></nav></header>
<main class="auth-wrap"><section class="auth-card"><div class="auth-icon">🎓</div><span class="eyebrow">STUDENT ACCOUNT</span><h1>Create account</h1><p class="muted">Register once and start pre-ordering.</p>
<form id="registerForm"><label>Full name<input id="name" type="text" placeholder="Your name" required></label><label>Email<input id="email" type="email" placeholder="you@example.com" required></label><label>Phone number<input id="phone" type="tel" placeholder="10-digit phone number" maxlength="10" required></label><label>Password<input id="password" type="password" placeholder="At least 6 characters" required></label><label>Confirm password<input id="confirm" type="password" placeholder="Repeat password" required></label><button class="btn primary full">Create account</button><p id="message" class="form-message"></p></form>
<p class="switch">Already registered? <a href="login.html">Login</a></p></section></main>
<script type="module" src="register.js"></script></body></html>
